ext {
    minSdkVersion = 24
    // compileSdkVersion stays at 36: the installed AndroidX libraries
    // (activity 1.11.0, core 1.17.0) require compiling against API 36 or
    // later. compileSdk only controls which APIs are available at compile
    // time; targetSdk (below) is what governs runtime letterboxing/
    // compatibility behavior and is intentionally kept at the requested 35.
    compileSdkVersion = 36
    targetSdkVersion = 35
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}